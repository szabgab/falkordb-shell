- text: Create a `Node` with the `Person` `label` (type) and the `name` attribute (property).
  code: >-
    CREATE (:Person {name: "Alice"})
- text: |
    Return all the Nodes.
    Remember this command and run once in a while during the tutorial.
    If you don't remember it, you can always press the Up arrow ⬆️  several times to go back to the previous commands.
  code: >-
    MATCH (p) RETURN p
- text: |
    Create another `Node` of type `Person`, set `p` as an `alias` to the created Node and return it.
    In a later example you'll see how to reuse this alias either inside the command or in the client language.
  code: >-
    CREATE (p:Person {name: "Bob", email: "bob@example.org"}) RETURN p
- text: Create a `Node` of type `Article` with an attribute `title`.
  code: >-
    CREATE (a:Article {title: "Introduction for FalkorDB"}) RETURN a
- text: |
    If we (mistakenly) leave out the colon `:` we create a `Node` without a label
    In this case `Person` is the alias that was not used to return the Node.
  code: >-
    CREATE (Person {name: "Clark"})
- text: |
    Create a link (edge, relationship) from Alice to Bob called `KNOWS`. (Alice knows Bob)
    The name of the edge is just an arbitrary word. You can use any name and you can even add attributes to the edges.
  code: >-
    MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'}) MERGE (a)-[:KNOWS]->(b)
- text: Create another type of link between `Alice` and that `Article`. This edge has an attribute.
  code: >-
    MATCH (p:Person {name: 'Alice'}), (a: Article) WHERE a.title = "Introduction for FalkorDB" MERGE (p)-[:published {date: "2026-05-18"}]->(a)
- text: Return all the Nodes.
  code: >-
    MATCH (p) RETURN p
- text: Return all the edges.
  code: >-
    MATCH ()-[r]->() RETURN r
- text: Return all the Nodes and all the edges in one command. (Limit to 4 entries to fit the screen)
  code: >-
    MATCH (n) OPTIONAL MATCH (n)-[e]-(m) RETURN * LIMIT 4
- text: Return all the Nodes with `Person` label
  code: >-
    MATCH (p:Person) RETURN p
- text: |
    Earlier we use `MATCH` to find an existing `Node` and we used `MERGE` to add an edge if it does not exist.
    Now we use `CREATE`.
    Instead of changing the existing Node this will create another `Node` of type `Person` with name `Alice`.
    It is usually not what you want.
  code: >-
    CREATE (p:Person {name: "Alice", email: "alice@example.org"}) RETURN p
- text: List all the Alice-es
  code: >-
    MATCH (p:Person, {name: "Alice"}) RETURN p
- text: |
    Update all the Person Nodes where the name is Alice adding a new attribute
    As we have 2 nodes matching, this will update both.
  code: >-
    MATCH (p:Person {name: 'Alice'}) SET p.age = 42 RETURN p
- text: Delete all the nodes (and thus all the relationships)
  code: >-
    MATCH (n) DETACH DELETE n
