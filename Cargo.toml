[package]
name = "falkordb-shell"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Command line client for FalkorDB"
keywords = ["cli", "web", "database", "falkordb"]
categories = ["database"]
readme = "README.md"
repository = "https://github.com/szabgab/falkordb-shell/"
homepage = "https://falkordb-shell.code-maven.com/"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
falkordb = "0.10.3"
rustyline = "18"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
