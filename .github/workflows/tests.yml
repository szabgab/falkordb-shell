name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: 6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Wait for FalkorDB
        run: |
          for _ in {1..30}; do
            if bash -c 'echo > /dev/tcp/127.0.0.1/6379' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "FalkorDB did not become ready in time" >&2
          exit 1

      - name: Run tests
        run: cargo test --quiet

  verify-release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        id: verify
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"

          if [ -z "$cargo_version" ]; then
            echo "Could not determine package version from Cargo.toml" >&2
            exit 1
          fi

          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Tag version $tag_version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  build-release-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - cargo-test
      - verify-release-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: falkordb-shell-linux-x86_64
            binary_name: falkordb-shell
          - os: macos-latest
            asset_name: falkordb-shell-macos
            binary_name: falkordb-shell
          - os: windows-latest
            asset_name: falkordb-shell-windows-x86_64.exe
            binary_name: falkordb-shell.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-release-binaries
      - verify-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.verify-release-tag.outputs.version }}
          files: release-assets/*

  build-release-site:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-release
      - verify-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install site generator dependency
        run: python -m pip install --upgrade markdown

      - name: Generate release site
        run: |
          python scripts/build_release_site.py \
            --readme README.md \
            --output site/index.html \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --version "${{ needs.verify-release-tag.outputs.version }}" \
            --release-date "$(date -u +%Y-%m-%d)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-release-site:
    needs: build-release-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
